name: Deploy lshare to Cloudflare

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment operation
        type: choice
        required: true
        default: deploy
        options:
          - prepare
          - check
          - deploy

permissions:
  contents: read

concurrency:
  group: lshare-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-production
      url: https://dl.ldev.cloud
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test tests/cloudflare
      - run: bun run build:cloudflare
      - name: Prepare private storage and deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            prepare) bun run cloud:deploy --prepare ;;
            check) bun run cloud:deploy --check ;;
            deploy) bun run cloud:deploy --prepare && bun run cloud:deploy ;;
            *) exit 1 ;;
          esac
